# Pings /api/notify so reset reminders go out (Vercel's free cron is
# daily-only). Works with ZERO configuration: without secrets it pings the
# default production URL unauthenticated.
#
# Optional repository secrets:
#   NOTIFY_URL    override if your deployment isn't the default domain
#   NOTIFY_SECRET only if you also set the NOTIFY_SECRET env var on Vercel
#
# Note: GitHub pauses scheduled workflows after ~60 days without repo
# activity — one click in the Actions tab re-enables it.
name: send-reset-reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the notifier
        run: |
          URL="${{ secrets.NOTIFY_URL }}"
          [ -z "$URL" ] && URL="https://mainichi-login-tracker.vercel.app/api/notify"
          SECRET="${{ secrets.NOTIFY_SECRET }}"
          [ -n "$SECRET" ] && URL="$URL?secret=$SECRET"
          curl -fsS --max-time 60 "$URL"
