# Pings /api/notify so reset reminders go out even though Vercel's free
# cron only runs daily. Requires two repository secrets:
#   NOTIFY_URL    e.g. https://mainichi-login-tracker.vercel.app/api/notify
#   NOTIFY_SECRET the same value as the NOTIFY_SECRET env var on Vercel
#
# Note: GitHub pauses scheduled workflows after ~60 days without repo
# activity — one click in the Actions tab re-enables it.
name: send-reset-reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the notifier
        run: |
          if [ -z "${{ secrets.NOTIFY_URL }}" ] || [ -z "${{ secrets.NOTIFY_SECRET }}" ]; then
            echo "NOTIFY_URL / NOTIFY_SECRET secrets not set — skipping"; exit 0
          fi
          curl -fsS --max-time 60 "${{ secrets.NOTIFY_URL }}?secret=${{ secrets.NOTIFY_SECRET }}"
